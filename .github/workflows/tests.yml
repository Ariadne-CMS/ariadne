---
name: CI/CD build in GitHub Actions

on: [ push ]

defaults:
  run:
    shell: bash

jobs:
  install-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:5.7
        env:
          TZ: "Europe/Amsterdam"
          MYSQL_ALLOW_EMPTY_PASSWORD: "no"
          MYSQL_ROOT_PASSWORD: "root"
          MYSQL_USER: "ariadne"
          MYSQL_PASSWORD: "secret"
          MYSQL_DATABASE: "ariadne"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Install packages
        run: |
          sudo apt update
          sudo apt install lynx subversion imagemagick tidy tree poppler-utils

      - name: Checkout repo
        uses: actions/checkout@v3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test browser PINP editor
        run: node --test tests/javascript/*.test.js

      - name: Wait for MySQL to be ready
        run: |
          mysql_ready=false
          for i in {1..30}; do
            if mysqladmin ping -h127.0.0.1 -uroot -proot --silent; then
              echo "MySQL is up!"
              mysql_ready=true
              break
            fi
            echo "Waiting for MySQL..."
            sleep 2
          done
          test "$mysql_ready" = true

      - name: Set SQL Mode
        run: |
          mysql -h127.0.0.1 -uroot -proot -e \
          "SET GLOBAL sql_mode = 'NO_ENGINE_SUBSTITUTION';"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, curl, zip, gd, imagick, mysqli, pdo_mysql, pdo_pgsql
          coverage: xdebug

      - name: Configure Apache2
        run: |
          sudo sed -i "s/www-data/runner/" /etc/apache2/envvars
          sudo a2dismod mpm_event
          sudo a2enmod mpm_prefork php8.4 rewrite
          sudo sed -i "s/AllowOverride None/AllowOverride All/" /etc/apache2/apache2.conf
          sudo rm -rf /var/www/html
          sudo ln -s '${{ github.workspace }}/www' /var/www/html
          echo '<?php $ariadne="${{ github.workspace }}/lib"; ?>' > '${{ github.workspace }}/www/ariadne.inc'
          sudo apache2ctl configtest
          # Apply the changed user/modules even if setup-php already started Apache.
          sudo systemctl restart apache2
          sudo systemctl status apache2.service

      - name: Setup SVN
        run: |
          svnadmin create '${{ github.workspace }}/files/temp/testsvn'
          svnadmin load '${{ github.workspace }}/files/temp/testsvn' < '${{ github.workspace }}/tests/svnrepo.log'

      - name: Cleanup vendor
        run: |
          rm -rf ${{ github.workspace }}/vendor/

      - name: Install composer dependencies
        uses: php-actions/composer@master
        with:
          args: --ignore-platform-reqs

      - name: Run syntax test
        run: |
          bash ./tests/syntax.sh '${{ github.workspace }}'

#      - name: Setup tmate session
#        uses: mxschmitt/action-tmate@v3
      
      - name: Install Ariadne
        run: |
          rm '${{ github.workspace }}/www/install/.htaccess'
          install_log="$RUNNER_TEMP/ariadne-install.html"
          if ! curl --fail-with-body --silent --show-error --max-time 300 \
            --output "$install_log" \
            --data "language=en&step=step6&database=mysql&database_host=127.0.0.1&database_user=ariadne&database_pass=secret&database_name=ariadne&admin_pass=test&admin_pass_repeat=test&ariadne_location&enable_svn=1&enable_workspaces=0&install_demo=1" \
            http://127.0.0.1/install/index.php; then
            cat "$install_log"
            exit 1
          fi
          # Installer preflight failures can return HTTP 200 without installing.
          if ! test -s lib/configs/ariadne.phtml; then
            echo "::error::Ariadne installation did not create lib/configs/ariadne.phtml"
            cat "$install_log"
            exit 1
          fi
          php -l lib/configs/ariadne.phtml
          if ! grep -Fq 'Ariadne is installed!' "$install_log"; then
            echo "::error::Ariadne installer did not report successful completion"
            cat "$install_log"
            exit 1
          fi
          if ! php -r '
            $ariadne = getcwd()."/lib/";
            $ARLoader = "cmd";
            require $ariadne."bootstrap.php";
            $storeClass = $store_config["dbms"]."store";
            $store = new $storeClass($root ?? null, $store_config);
            $installed = $store->exists("/system/ariadne/version/");
            $store->close();
            exit($installed ? 0 : 1);
          '; then
            echo "::error::Ariadne bootstrap or base-package verification failed"
            cat "$install_log"
            exit 1
          fi

      - name: List files/templates
        run: |
          tree '${{ github.workspace }}/files/templates/'

      - name: Run phpunit tests
        run: |
         cd '${{ github.workspace }}'
         ./vendor/bin/phpunit

      - name: Run surface tests
        run: |
         cd '${{ github.workspace }}/tests/surface/'
         bash run.sh

      - name: Test login page
        run: |
          cd ${{ github.workspace }}/tests/curl/
          export URL=http://localhost/
          export TMPDIR=/tmp/
          bash test-login.sh

      - name: Test explore
        run: |
          cd ${{ github.workspace }}/tests/curl/
          export URL=http://localhost/
          export TMPDIR=/tmp/
          bash test-explore.sh

      - name: Test demo site
        run: |
          cd ${{ github.workspace }}/tests/curl/
          export URL=http://localhost/
          export TMPDIR=/tmp/
          bash test-demosite.sh

      - name: Cat error log
        if: always()
        run: |
          sudo cat /var/log/apache2/error.log
